[package]
name = "tally"
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
description = "Feature catalogue, typed test tags and coverage reports for the Raul repositories."
repository = "https://github.com/JorisJonkers-dev/tally"
publish = false

[dependencies]
# MIT OR Apache-2.0. The catalogue files.
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
# MIT OR Apache-2.0. Reading the catalogue, writing the JSON report.
serde = { version = "1.0.229", features = ["derive"] }
# MIT OR Apache-2.0. tally-report.v1 and tally-results.v1.
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# The check and reader functions are flat lists of rules; splitting them would hide the list.
too_many_lines = "allow"

[profile.release]
strip = true
