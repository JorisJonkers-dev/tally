# Tooling for the checks in Taskfile.yml. `mise install` is the only setup step; CI uses the same file.
[tools]
rust = { version = "1.100.0", components = "clippy,rustfmt,llvm-tools-preview" }
task = "3.54.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
"aqua:EmbarkStudios/cargo-deny" = "0.21.0"
"aqua:zizmorcore/zizmor" = "1.32.0"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
